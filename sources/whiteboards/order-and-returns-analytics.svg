<svg xmlns="http://www.w3.org/2000/svg" viewBox="-525.7451923076923 -495.117437900641 1265.2687377929688 1149.6186398237178"><title>order and returns analytics — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-525.7451923076923" y="-495.117437900641" width="1265.2687377929688" height="1149.6186398237178" fill="white"/>
