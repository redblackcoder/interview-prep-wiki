<g transform="translate(-468.251201923077 -45.784254807692264) rotate(0.0 139.3699188232422 100.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Dim</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Customer</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Product</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Order</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  - Id, Order Id, Order Date</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Fact</text></g>
<g transform="translate(-475.74519230769226 379.5012019230769) rotate(0.0 427.8497314453125 112.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Top K Product Sold in Last Month by Amount</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Product Name, Amount</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">SELECT ProductName, SUM(Quantity * Price) AS Amount</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">FROM Product, Sales</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">WHERE Product.ID = Sales.ProductId AND get_month(Sales.SoldOn) = today().month()</text><text x="0" y="195.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">ORDER BY SUM(Quantity * Price) DESC</text><text x="0" y="220.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">LIMIT 10;</text></g>
<g transform="translate(-452.04627403846155 130.79927884615424) rotate(0.0 68.45995330810547 87.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Sales</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- SoldOn</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Product Id</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Customer Id</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Order Id</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Quantity</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Price</text></g>
<g transform="translate(-162.59014423076928 -23.83413461538447) rotate(0.0 66.8099594116211 37.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Order Items</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> - Order ID</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> - Product Id</text></g>
