<svg xmlns="http://www.w3.org/2000/svg" viewBox="-470.815673828125 -459.72206115722656 967.4393310546875 388.13511657714844"><title>count islands — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-470.815673828125" y="-459.72206115722656" width="967.4393310546875" height="388.13511657714844" fill="white"/>
<g transform="translate(-417.89166259765625 -221.58694458007812) rotate(0.0 92.10998439788818 50.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">[[&quot;1&quot;,&quot;1&quot;,&quot;0&quot;,&quot;0&quot;,&quot;0&quot;],</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> [&quot;1&quot;,&quot;1&quot;,&quot;0&quot;,&quot;0&quot;,&quot;0&quot;],</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> [&quot;0&quot;,&quot;0&quot;,&quot;1&quot;,&quot;0&quot;,&quot;0&quot;],</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> [&quot;0&quot;,&quot;0&quot;,&quot;0&quot;,&quot;1&quot;,&quot;1&quot;]]</text></g>
<g transform="translate(-420.815673828125 -409.72206115722656) rotate(0.0 433.71966552734375 62.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Given an m x n 2D binary grid grid which represents a map of &#x27;1&#x27;s (land) and &#x27;0&#x27;s (water),</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">return the number of islands.</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">An island is surrounded by water and is formed by connecting adjacent lands horizontally</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">or vertically. You may assume all four edges of the grid are all surrounded by water.</text></g>
<g transform="translate(-201.2806396484375 -175.72528076171875) rotate(0.0 44.8568115234375 0.44061279296875)"><polyline points="0,0 89.713623046875,0.8812255859375" fill="none" stroke="#384455" stroke-width="2" marker-end="url(#arrow)"/></g>
<g transform="translate(-56.55889892578125 -187.34320068359375) rotate(0.0 45.809967041015625 12.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">3 Islands</text></g>
