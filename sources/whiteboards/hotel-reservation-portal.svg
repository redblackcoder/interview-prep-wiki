<svg xmlns="http://www.w3.org/2000/svg" viewBox="-795.053829619321 -1284.56640625 1446.154534238642 2326.60546875"><title>hotel reservation portal — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-795.053829619321" y="-1284.56640625" width="1446.154534238642" height="2326.60546875" fill="white"/>
<g transform="translate(-641.7860141306791 -1234.56640625) rotate(0.0 527.34375 60.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">We plan to create and run our own hotel reservation system for multiple hotels.</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Users can book hotel rooms from different hotels, including small hotels and large chains.</text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Focus on the ability to ingest, search, and reserve rooms.</text></g>
<g transform="translate(-625.9891391306791 -995.0859375) rotate(0.0 562.5 156.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Requirements</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">1. Onboarding experience for partner hotels (100,000 partners hotels - rooms in range 10 - 1000)</text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">2. Users can search for the hotels</text><text x="0" y="92.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   a. Location</text><text x="0" y="116.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   b. Name</text><text x="0" y="140.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   c. Data Range</text><text x="0" y="164.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">3. Reserve the rooms - one room &amp; 2 adults</text><text x="0" y="188.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">4. 1 M DAU</text><text x="0" y="212.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">5. 100,000 peak - searches per sec =&gt; 10% are reservation</text><text x="0" y="236.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">6. Search latency &lt; 1 sec</text><text x="0" y="260.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">7. Correctness for reservering rooms - no double booking or blocked rooms</text></g>
<g transform="translate(-613.0242953806791 -547.40234375) rotate(0.0 404.296875 84.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Hotel - name, id, location</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Rooms - hotel_id, id, type</text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Reservations - room_id, id, customer_id, start_date, end_date</text><text x="0" y="92.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Availability - room_id, id, date (model 1)</text><text x="0" y="116.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">             - room_id, id, start_date, end_date (model 2)</text><text x="0" y="140.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="164.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">    200 * 100,000 =&gt; 20,000,000 million rooms * 500 days =&gt;  1 B rows</text></g>
<g transform="translate(-626.0399203806791 -311.05859375) rotate(0.0 281.25 24.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Search Index =&gt; Hotel attributes (name)</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Geo Index =&gt; Location (range/radius based query)</text></g>
