<g transform="translate(-701.7157016306791 74.453125) rotate(0.0 152.34375 48.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">/search GET</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">name: &lt;Example Hotel&gt;</text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">location_lat, location_log</text><text x="0" y="92.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">start_date, end_date</text></g>
<g transform="translate(-448.70398288067906 483.87109375) rotate(0.0 234.375 48.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">SELECT * FROM Hotels</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">WHERE search_text &lt;full_text_op&gt; &#x27;Example Hotel&#x27;</text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">AND geo_fn(lat, long, radius)</text><text x="0" y="92.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">LIMIT 100;</text></g>
<g transform="translate(-445.50085788067906 625.20703125) rotate(0.0 187.5 180.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">SELECT * FROM Hotels</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">WHERE geo_fn(lat, long, radius) </text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">LIMIT 100;</text><text x="0" y="92.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="116.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">GET /hotel_index_v1</text><text x="0" y="140.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">{</text><text x="0" y="164.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  should_match: 1</text><text x="0" y="188.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  {</text><text x="0" y="212.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">     text: &#x27;Example Hotel&#x27;</text><text x="0" y="236.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  },</text><text x="0" y="260.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  {</text><text x="0" y="284.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">     type: resort</text><text x="0" y="308.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  },</text><text x="0" y="332.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  count: 100</text><text x="0" y="356.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">}</text></g>
<g transform="translate(144.06945461932094 876.10546875) rotate(0.0 228.515625 48.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">SELECT * FROM Hotels h</text><text x="0" y="44.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">JOIN Rooms r ON h.id = r.hotel_id</text><text x="0" y="68.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">JOIN Availability a ON a.room_id = r.id</text><text x="0" y="92.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">WHERE a.date &gt;= start_date AND end_date</text></g>
