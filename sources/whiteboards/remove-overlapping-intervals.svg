<g transform="translate(267.7060546875 -317.9815979003906) rotate(0.0 6.359992980957031 12.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">8</text></g>
<g transform="translate(-530.5816040039062 -114.68008422851562) rotate(0.0 528.2797046005726 37.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Can I remove the interval which overlap as going over intervals in sorted order (by their start endpoint)?</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">No, that cannot provide the optimal solution. Too many intervals need to be dropped without knowing other</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">overlapping intervals down the line.</text></g>
<g transform="translate(-530.135986328125 34.2178955078125) rotate(0.0 530.3896484375 75.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Another approach to think about is finding overlaps for all the intervals as a first scan. Now, I have, for</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">each interval, which all other intervals are overlapping. Using this data structure, start removing the interval</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">with most number of overlaps and keep going until there are overlapping intervals.</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">How to prove that this will result in most optimal solution?</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">No idea :(</text></g>
<g transform="translate(-525.8222045898438 257.6092529296875) rotate(0.0 526.2696533203125 112.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Maybe a dynamic programing approach will result in the most optimal solution. Previous approach was greedy.</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Say, input interval set after sorting is I_1_N where N is the number of the intervals</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Define,</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">S_i =&gt; minimal number of intervals to remove to make I_i_N non-overlapping</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">S_i = min(1 + S_i+1, S_j) where j is the smallest value s.t. I[j].start &gt;= I[i].end</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="195.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">We build S_i(s) starting from S_N and iterating backwards to S_1.</text><text x="0" y="220.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Answer = S_1</text></g>
</svg>
