<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1146.322265625 -1134 2003.87890625 1773.046875"><title>ride dispatch — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-1146.322265625" y="-1134" width="2003.87890625" height="1773.046875" fill="white"/>
<g transform="translate(-939.544921875 -924.94140625) rotate(0.0 222.29983520507812 12.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Design a On-demand driver allocation platform</text></g>
<g transform="translate(-1096.322265625 -837.80078125) rotate(0.0 407.8997802734375 237.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Functional Requirements</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">1. A user comes in and requests a ride - starting point &amp; ending point</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   a. kind of ride -- standard, luxury, XL, etc.</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">2. Scheduling up ahead - X</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">3. We have a pool of drivers available on the platform</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   - find one which matches the request and send them request for the ride</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   - if the driver accepts, connect them to the rider</text><text x="0" y="195.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">4. Waiting/Finding driver for you on the app</text><text x="0" y="220.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">5. Sharing driver details on confirmation.</text><text x="0" y="245.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">5. Driver is coming, where driver is, etc. [P2]</text><text x="0" y="270.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="295.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="320.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Non-functional Requirements</text><text x="0" y="345.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">1. Scale - 1 Billion total riders, 100 M total drivers, 20 M completes rides every day</text><text x="0" y="370.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   -- 20 x 10^6 rides/day --&gt; 200 rides/sec</text><text x="0" y="395.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">   -- 100x on spikes --&gt; 20,000 rides/sec</text><text x="0" y="420.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">2. High Availability</text><text x="0" y="445.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">3. Correctness -&gt; once we match a rider &amp; driver</text><text x="0" y="470.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">4. Latency -&gt; find a matchign drivers unde 30 secs</text></g>
