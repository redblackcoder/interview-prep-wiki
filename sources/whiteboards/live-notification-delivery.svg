<svg xmlns="http://www.w3.org/2000/svg" viewBox="-889.6171875 -684.873046875 1752.37890625 1044.6925133136529"><title>live notification delivery — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-889.6171875" y="-684.873046875" width="1752.37890625" height="1044.6925133136529" fill="white"/>
<g transform="translate(-672.43359375 -634.873046875) rotate(0.0 430.1797180175781 237.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Notification System</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Requirements</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Users connected over webapp or a mobile app</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Something of interest happened for a user, system needs to push a notification for it</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Time based sorting</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Notified exactly once</text><text x="0" y="195.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  - No duplicates</text><text x="0" y="220.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  - No missing notification</text><text x="0" y="245.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="270.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- High Scale</text><text x="0" y="295.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  - 100 M active users</text><text x="0" y="320.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  - 1 B notification per day</text><text x="0" y="345.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="370.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- High Availability</text><text x="0" y="395.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">- Low Latency</text><text x="0" y="420.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">  - few second (near real time)</text></g>
