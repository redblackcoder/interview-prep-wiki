<svg xmlns="http://www.w3.org/2000/svg" viewBox="-324.4649353027344 -716.271484375 1266.84814453125 1662.900390625"><title>top shared articles — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-324.4649353027344" y="-716.271484375" width="1266.84814453125" height="1662.900390625" fill="white"/>
<g transform="translate(-194.509765625 -666.271484375) rotate(0.0 257.84991455078125 22.5)"><text x="0" y="36.0" font-family="sans-serif" font-size="36" text-anchor="start" fill="#19273a">Design Top K Articles Shared</text></g>
<g transform="translate(-187.10165405273438 -532.77734375) rotate(0.0 528.4595947265625 200.0)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Count articles in memory</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Bucket every 1 minute =&gt; 5 min window will only update at the minute mark.</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Number of buckets in 24 hours = 24 * 60 = 1440 ~ 2000</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Hashtable to store the count of shares by article and time bucket.</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Key = Time Bucket + Article ID (long + long = 16 bytes)</text><text x="0" y="195.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Value = count (uint = 4 bytes) uint max value ~ 2 billion, sufficient for number of shares in a minute</text><text x="0" y="220.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="245.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Memory needed to store 2000 buckets across 1 Million articles, assuming 80% load factor for a</text><text x="0" y="270.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">open addressed hash table.</text><text x="0" y="295.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">= 2000 * 1 M * (20 bytes) * 1.25</text><text x="0" y="320.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">= 2 B * 25 bytes = 50 B bytes ~ 50 GB</text><text x="0" y="345.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="370.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">1 machine (64 GB) is sufficient to hold all counts. Checkpoint the counts to a durable storage every minute.</text><text x="0" y="395.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Keep counts on two machines, in active/passive configuration, for redundancy.</text></g>
<g transform="translate(-192.79696655273438 -591.3203125) rotate(0.0 250.47988891601562 12.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Top K articles over last 24 hour, 1 hour, 5 min, etc.</text></g>
