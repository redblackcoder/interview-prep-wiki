<g transform="translate(-230.17196655273438 -71.94921875) rotate(0.0 83.47991943359375 50.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">{</text><text x="0" y="36.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">  timestamp: &lt;epoch&gt;,</text><text x="0" y="56.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">  articleId: &lt;id&gt;,</text><text x="0" y="76.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">  ...</text><text x="0" y="96.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">}</text></g>
<g transform="translate(-197.08602905273438 44.71875) rotate(0.0 46.37596130371094 10.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Kafka Topic</text></g>
<g transform="translate(-274.4649353027344 188.9375) rotate(0.0 241.42373657226562 150.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Use threads and multiple partitions</text><text x="0" y="36.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">to speed up updating counts in memory.</text><text x="0" y="56.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Updating count for each article share</text><text x="0" y="76.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">will be very fast (1 micro-sec).</text><text x="0" y="96.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Say 8 threads (8+ cores so that they</text><text x="0" y="116.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">can execute concurrently).</text><text x="0" y="136.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="156.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Fetch message in bulk from kafka.</text><text x="0" y="176.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Kafka message pull latency ~ 10 ms.</text><text x="0" y="196.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="216.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Pull all messages in last 10 ms in every poll.</text><text x="0" y="236.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Each thread can process 10_000 messages in 10 ms,</text><text x="0" y="256.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">this allows for 80_000 messages in 10 ms overall throughput.</text><text x="0" y="276.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="296.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">=&gt; 8_000_000 articles shared per sec.</text></g>
<g transform="translate(89.37490844726562 -84.08984375) rotate(0.0 118.50389099121094 10.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">timeBucket, articleId -&gt; count</text></g>
<g transform="translate(371.4960021972656 232.140625) rotate(0.0 240.0718231201172 70.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Questions</text><text x="0" y="36.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">1. How to find top K articles by share count?</text><text x="0" y="56.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">2. How to expire old counts?</text><text x="0" y="76.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">3. What is the format for storing the checkpoint data in S3?</text><text x="0" y="96.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="116.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Answer 2</text><text x="0" y="136.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">It is simple, old time buckets drop out of the HashMap.</text></g>
<g transform="translate(368.5116271972656 396.62890625) rotate(0.0 261.935791015625 250.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Answer 1</text><text x="0" y="36.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Say, for 24 hour window,</text><text x="0" y="56.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">SUM(count) BY articleId WHERE timeBucket IN LAST 5 MINUTES</text><text x="0" y="76.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="96.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Sequential processing over 2 B entries may take a while.</text><text x="0" y="116.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Say, 1 micro-sec to read each</text><text x="0" y="136.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">=&gt; 2 * 10^9 micro-sec</text><text x="0" y="156.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">    = 2_000 sec</text><text x="0" y="176.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">    ~ 30 min</text><text x="0" y="196.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="216.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Let&#x27;s assume 8 way split, then it will take</text><text x="0" y="236.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">~ 250 sec for the first phase</text><text x="0" y="256.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">~ 4 min</text><text x="0" y="276.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="296.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Second phase, combine results from 8 top-K.</text><text x="0" y="316.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Say K = 100</text><text x="0" y="336.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">~ 1 ms</text><text x="0" y="356.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="376.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">~ 5 min for 24 hour window</text><text x="0" y="396.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a"></text><text x="0" y="416.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">For 5 min window, only need to look at 5 M entries.</text><text x="0" y="436.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">~ 5/2000 * 5 min</text><text x="0" y="456.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">= (25 * 60)/2000 sec</text><text x="0" y="476.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">= 1500/2000 sec</text><text x="0" y="496.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">= 3/4 sec ~ 1 sec.</text></g>
<g transform="translate(-267.4063415527344 557.94140625) rotate(0.0 35.15998077392578 20.0)"><text x="0" y="16.0" font-family="sans-serif" font-size="16" text-anchor="start" fill="#19273a">Answer 3</text></g>
</svg>
