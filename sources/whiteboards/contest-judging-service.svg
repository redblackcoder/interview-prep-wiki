<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1364.2777557373047 -942.0523638044083 2032.4851989746094 1904.1388569096325"><title>contest judging service — anonymized whiteboard</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#384455"/></marker></defs><rect x="-1364.2777557373047" y="-942.0523638044083" width="2032.4851989746094" height="1904.1388569096325" fill="white"/>
<g transform="translate(-1065.3168182373047 -718.6702924455917) rotate(0.0 552.3594970703125 112.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Design an Online Judge system that can run contests where users solve algorithmic questions</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">We have a number of registered users already (few thousand)</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Contest has a start and end time</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">On start, problems are published on the contest site</text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Problems are of an algorithmic nature (ex. sort an array of integers)</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Users can solve problems and submit answers in any order</text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">Solution is source code</text><text x="0" y="195.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">System will verify and either accept or reject a solution</text><text x="0" y="220.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">There&#x27;s a ranking table showing scores - ranking depends on number of failed attempts and submission time only</text></g>
<g transform="translate(-1314.2777557373047 -389.9281049455917) rotate(0.0 27.59998321533203 87.5)"><text x="0" y="20.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">List</text><text x="0" y="45.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> - P0</text><text x="0" y="70.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> - P1</text><text x="0" y="95.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="120.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a">...</text><text x="0" y="145.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"></text><text x="0" y="170.0" font-family="sans-serif" font-size="20" text-anchor="start" fill="#19273a"> - Pk</text></g>
